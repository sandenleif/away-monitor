name: Release

# Ein Tag wie v1.1.0 baut die Exe und haengt sie samt Pruefsumme ans Release.
# Genau diese beiden Dateien sucht der eingebaute Updater.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Modell laden
        run: python scripts/fetch_model.py

      - name: Version gegen Tag pruefen
        shell: pwsh
        run: |
          $version = (Select-String -Path 'away_monitor/__init__.py' -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -ne $tag) {
            throw "__version__ ist $version, der Tag lautet $tag -- erst __init__.py anpassen."
          }
          Write-Host "Version $version passt zum Tag."

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Exe bauen
        run: |
          python scripts/make_icon.py
          pyinstaller away-monitor.spec --noconfirm --clean

      - name: Pruefsumme schreiben
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/away-monitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  away-monitor.exe" | Set-Content dist/away-monitor.exe.sha256 -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/away-monitor.exe
            dist/away-monitor.exe.sha256
          generate_release_notes: true
